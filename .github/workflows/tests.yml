name: tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt keyrings.alt
      - name: Unit tests
        run: |
          python -m unittest $(ls tests/test_*.py | sed 's#/#.#;s#\.py$##')
      - name: Fresh-install smoke test
        run: python scripts/smoke_test.py
